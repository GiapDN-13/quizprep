[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback (phòng khi sau này thêm routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cho phép app gọi dữ liệu; không cache file dữ liệu để cập nhật thấy ngay
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"
